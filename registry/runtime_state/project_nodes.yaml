      all 74 current tests for strict MACE provenance, geometry, history, and
      collapse gating. All six selected-point inputs share complete calculator
      identity 7111008577b76397 with zero parse errors; N24 acceptance remains
      pending.
      At the 18:27Z checkpoint, selected direct jobs remained running at
      36/48/45 steps. All transformed parents cleanly reached nstep=50 without
      BFGS convergence and were continued as jobs 30860584/30860628/30860689
      with nstep=200 and max_seconds=84600. At 18:33Z all eight exact r2 jobs
      were healthy and running; only 1-7/image2 met the current-geometry same-
      basin diagnostic. Every formal comparison remains pending_not_converged.

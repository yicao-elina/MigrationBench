      every force evaluation with the input or preceding printed geometry;
      Rockfish regression job 30851575 passed 60 tests. The site-search audit
      found 245/245 mirrored QE inputs missing CELL_PARAMETERS with ibrav=0, so
      direct submission is forbidden. The frozen prospective v5 batch injects
      one hash-bound reference cell and globally matches six proposals to six

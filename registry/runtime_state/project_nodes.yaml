      all 12 inputs are complete under calculator identity 03738b164d4bdccb and
      byte-identical across local and Rockfish generation. Rockfish comparator
      smoke 30854874 passed three tests for global matching, cell completeness,
      censored-result suppression, and input/runtime provenance binding. The
      complete strict acceptance chain was then validated by Rockfish CPU job
      30856509; two synthetic first/repeat records passed input, Slurm-job, and
      pw.x provenance gates, batch acceptance returned 2/2, and basin assignment
      preserved two distinct basins. This is software evidence, not a physical
      endpoint result.
      The prospective comparator no longer counts a first-relax success as a
      stable-site yield. It requires the repeat acceptance artifact to bind the
      first-status hash, parent job, calculator, and runtime evidence. Rockfish
      job 30857156 validates accepted, rejected-repeat, and missing-repeat paths.
      The read-only stage planner now makes wait, continuation, repeat,
      acceptance, basin, and final-comparison transitions explicit; Rockfish job
      30857186 validates the staged progression with four passing tests.

      site-proposer coordinates by the bounded periodic soft-contact objective.
      Shifts span 0.006-0.235 A, all transformed inputs retain >2.60 A Cr-host
      clearance, and all 18 direct/control/transformed inputs share calculator
      identity 03738b164d4bdccb. Transformed jobs 30861875/80/81/94 and
      30861902/15 are running; their direct controls are proposal jobs

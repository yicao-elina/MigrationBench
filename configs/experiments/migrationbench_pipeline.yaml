project:
  name: MigrationBench
  dataset_repo: alinacao2000/MigrationBench
  local_revision_root: .
  local_source_root: data/raw_compact
  cluster_root: /data/pclancy3/yi/flare-data/1-Cr-Sb2Te3
  cluster_readonly_root: /data/pclancy3/yi/flare-data/1-Cr-Sb2Te3
  cluster_run_root: /scratch16/pclancy3/yi/revision1_migrationbench_runs

policy:
  paper_number_rule: "No value enters manuscript tables/figures unless it is derived from raw artifacts by a local script."
  compute_resource_preference: "Prefer CPU Slurm resources for QE NEB and for MACE preconditioning smoke/production runs unless GPU acceleration is explicitly needed."
  dft_reference_status_allowed:
    - converged
    - numerically_stationary_unconverged
  quarantine_statuses:
    - unconverged
    - diverged
    - png_digitized_only
    - placeholder_energy
    - geometry_only
    - cluster_pending
  trainable_labels:
    required:
      - energy
      - forces
    forbidden_if:
      - zero_force_fabricated
      - neb_eval_only

dft:
  code: Quantum ESPRESSO
  neb_program: neb.x
  canonical_barrier_definition: "forward activation energy, peak relative to first image"
  default_path:
    string_method: neb
    opt_scheme: broyden
    CI_scheme: auto
    first_last_opt: false
    minimum_image: true
    path_thr_eV_per_A:
      production: 0.03
      final_check: 0.02
    ds:
      coarse: 0.5
      production: 0.2
    k_min: 0.1
    k_max: 0.3
  qe_input_strategy:
    from_mlff_images: "Use MLFF-relaxed images as FIRST/INTERMEDIATE/LAST_IMAGE positions in a single neb.x input."
    restartable: "Also emit image directories and a manifest, so cluster jobs can be restarted and audited."

models:
  foundation:
    label: MACE Foundation
    cluster_path: /data/pclancy3/yi/flare-data/1-Cr-Sb2Te3/3.fine-tuning/2-layer/MACE-omat/MACE-matpes-pbe-omat-ft.model
    role: foundation_or_mlff_preconditioner
  scratch_seed_123:
    label: MACE Scratch seed 123
    cluster_path: /data/pclancy3/yi/flare-data/1-Cr-Sb2Te3/3.fine-tuning/2-layer/MACE_models_l1_0802/mace_l1_0802_compiled.model
    role: reported_baseline
  ft_600k_seed_234:
    label: MACE FT-600K seed 234
    cluster_path: /data/pclancy3/yi/flare-data/1-Cr-Sb2Te3/3.fine-tuning/2-layer/MACE-multihead_600K/finetuned_MACE_multihead0804_compiled.model
    role: reported_finetuned
  ft_multit_seed_234:
    label: MACE FT-MultiT seed 234
    cluster_path: /data/pclancy3/yi/flare-data/1-Cr-Sb2Te3/3.fine-tuning/2-layer/MACE-multihead_Multi_T/finetuned_MACE_multihead0804.model
    role: reported_finetuned


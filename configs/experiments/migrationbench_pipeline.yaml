acceptance_gates:
  dft_neb:
    max_force_eV_per_A: 0.03
    max_barrier_drift_last_two_iterations_eV: 0.02
    require_job_done: true
    allow_stationary_exception_for_revision_triage: true
  mlff_pre_neb:
    fmax_eV_per_A: 0.05
    max_steps: 1000
    require_no_energy_spike_eV: 5.0
    max_abs_relaxation_energy_delta_per_internal_image_eV: 5.0
    require_no_internal_image_basin_collapse: true
    relaxation_delta_interpretation: "Large negative energy delta is a warning if it changes the path basin; it is not automatically acceptable."
  repair_preconditioner:
    preserve_endpoints: true
    min_pair_distance_A_hard_floor: 1.70
    prefer_min_pair_distance_A: 2.0
    require_before_after_geometry_metrics: true
    require_followup_mlff_energy_delta_audit: true
    manuscript_evidence_role: "proposal_generation_only"
  train_test_leakage:
    soap_distance_near_duplicate_threshold: 0.01
    rmsd_near_duplicate_A: 0.05

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "migrationbench"
version = "0.1.0"
description = "Reproducible MigrationBench analysis, provenance, and paper workflow"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "ase==3.25.0",
  "matplotlib==3.9.4",
  "numpy==2.0.2",
  "pandas==2.3.1",
  "pyarrow==17.0.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "scipy==1.13.1",
]

[project.optional-dependencies]
workflow = ["snakemake==8.25.5", "snakemake-executor-plugin-slurm==0.13.0"]
test = ["pytest==8.4.2", "ruff==0.12.11"]
mlff = ["mace-torch==0.3.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/migrationbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
